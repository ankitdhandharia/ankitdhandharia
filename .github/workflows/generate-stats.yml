name: Generate Profile SVG & Upstream Stats
on:
  # Refresh open-source metrics and custom SVG card every 6 hours
  schedule:
    - cron: "0 */6 * * *"
  # Allow manual trigger from the GitHub Actions tab
  workflow_dispatch:
  # Regenerate when the generator script or workflow changes
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/generate-stats.yml"
      - ".github/scripts/generate_oss_card.py"

permissions:
  contents: write

jobs:
  update-svg:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_STATS_TOKEN || secrets.METRICS_TOKEN }}
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Generate Custom Open Source Showcase SVG
        env:
          GH_TOKEN: ${{ secrets.GH_STATS_TOKEN || secrets.METRICS_TOKEN }}
        run: |
          python3 .github/scripts/generate_oss_card.py

      - name: Commit and Push Updated SVG
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add open-source-showcase.svg
          if ! git diff --staged --quiet; then
            git commit -m "chore(stats): auto-update open-source showcase SVG [skip ci]"
            git pull --rebase origin main
            git push
          fi
