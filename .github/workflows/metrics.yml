name: Metrics
on:
  # Refresh the immersive stat panels every 6 hours
  schedule:
    - cron: "0 */6 * * *"
  # Allow manual runs from the Actions tab
  workflow_dispatch:
  # Regenerate whenever the workflow itself changes
  push:
    branches: ["main"]
    paths: [".github/workflows/metrics.yml"]

permissions:
  contents: write

jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:
      # ---------------------------------------------------------------
      # Panel 1 — Overview: header, activity, community, languages, lines
      # ---------------------------------------------------------------
      - name: Overview panel
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: github-metrics.svg
          template: classic
          base: header, activity, community, repositories, metadata
          config_timezone: America/New_York
          config_padding: 6%, 6%
          plugin_languages: yes
          plugin_languages_indepth: yes
          plugin_languages_details: bytes-size, percentage
          plugin_languages_limit: 8
          plugin_languages_sections: most-used
          plugin_lines: yes

      # ---------------------------------------------------------------
      # Panel 2 — Immersive 3D isometric commit calendar (full year)
      # ---------------------------------------------------------------
      - name: Isometric calendar panel
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: github-metrics.isocalendar.svg
          base: ""
          config_timezone: America/New_York
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

      # ---------------------------------------------------------------
      # Panel 3 — Coding habits, activity clock & achievements
      # ---------------------------------------------------------------
      - name: Habits & achievements panel
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: github-metrics.habits.svg
          base: ""
          config_timezone: America/New_York
          plugin_habits: yes
          plugin_habits_from: 200
          plugin_habits_days: 14
          plugin_habits_facts: yes
          plugin_habits_charts: yes
          plugin_achievements: yes
          plugin_achievements_threshold: C
          plugin_achievements_secrets: yes
          plugin_achievements_display: compact
          plugin_achievements_limit: 0
